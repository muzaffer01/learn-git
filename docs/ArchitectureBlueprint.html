<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>learn-git — Architecture Blueprint</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"><style>
  :root { --bg:#0b1f33; --surface:#102640; --surface-2:#153049; --line:#2c5578; --line-bright:#4a7fa5; --text:#eaf3fb; --muted:#93b4cc; --accent:#5ec8e8; --open:#f2b84b; --open-bg:#3a2a10; --ok:#6fd49a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:400 18px/1.55 "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; padding:40px 20px 64px;
    background-image: linear-gradient(rgba(44,85,120,.35) 1px, transparent 1px), linear-gradient(90deg, rgba(44,85,120,.35) 1px, transparent 1px); background-size:32px 32px; }
  main { max-width: 1040px; margin: 0 auto; }
  h1 { font:700 34px/1.15 "IBM Plex Sans"; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 8px; max-width: 75ch; }
  .legend { display:flex; flex-wrap:wrap; gap:8px 22px; margin:14px 0 6px; font-size:16px; color:var(--muted); }
  .legend i { display:inline-block; width:22px; height:14px; border:2px solid var(--accent); border-radius:3px; margin-right:8px; vertical-align:-2px; background:var(--surface); }
  .legend i.warn { border-color:var(--open); background:var(--open-bg); } .legend i.plan { border:2px dashed var(--muted); }
  section { margin-top:34px; }
  h2 { font:600 25px/1.2 "IBM Plex Sans"; margin:0 0 10px; color:var(--accent); }
  figure { margin:0; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:14px; overflow-x:auto; }
  svg { width:100%; min-width: 640px; height:auto; display:block; }
  figcaption { color:var(--muted); font-size:16px; margin-top:10px; max-width:90ch; }
  .bx { fill:var(--surface-2); stroke:var(--line-bright); stroke-width:2; } .bx.ok { stroke:var(--accent); } .bx.warn { stroke:var(--open); fill:var(--open-bg); }
  .bx.plan { stroke:var(--muted); stroke-dasharray:6 4; fill:transparent; } .bx.lane { fill:transparent; stroke:var(--line); stroke-dasharray:2 4; }
  .t { fill:var(--text); font:600 15.5px "IBM Plex Sans"; } .s { fill:var(--muted); font:400 13.5px "IBM Plex Sans"; } .l { fill:var(--muted); font:500 13px "IBM Plex Mono", monospace; }
  .ar { stroke:var(--line-bright); stroke-width:2.2; fill:none; } .ar.d { stroke-dasharray:6 4; } .head { fill:var(--line-bright); }
</style></head><body><main><h1>learn-git: Architecture Blueprint</h1><p class="sub">A small practice repository for learning git commands and workflow.</p><div class="legend"><span><i></i>Built or in place</span><span><i class="warn"></i>Blocked or needs attention</span><span><i class="plan"></i>Planned or not started</span></div><section><h2>Practice path</h2><figure><svg viewBox="0 0 1030 232" role="img" aria-label="Git practice path: init and commit, branch main, remote and push, branch dev are practiced; merge and pull request are next."><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="head" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bx ok" x="20" y="40" width="140" height="84" rx="8"/><text class="t" x="90.0" y="78.0" text-anchor="middle">init, add, commit</text><text class="s" x="90.0" y="96.0" text-anchor="middle">practiced</text><rect class="bx ok" x="190" y="40" width="140" height="84" rx="8"/><text class="t" x="260.0" y="78.0" text-anchor="middle">Branch main</text><text class="s" x="260.0" y="96.0" text-anchor="middle">practiced</text><line class="ar" x1="160" y1="82" x2="190" y2="82" marker-end="url(#ah)"/><rect class="bx ok" x="360" y="40" width="140" height="84" rx="8"/><text class="t" x="430.0" y="78.0" text-anchor="middle">Remote and push</text><text class="s" x="430.0" y="96.0" text-anchor="middle">practiced</text><line class="ar" x1="330" y1="82" x2="360" y2="82" marker-end="url(#ah)"/><rect class="bx ok" x="530" y="40" width="140" height="84" rx="8"/><text class="t" x="600.0" y="78.0" text-anchor="middle">Branch dev</text><text class="s" x="600.0" y="96.0" text-anchor="middle">practiced, 1 commit ahead</text><line class="ar" x1="500" y1="82" x2="530" y2="82" marker-end="url(#ah)"/><rect class="bx warn" x="700" y="40" width="140" height="84" rx="8"/><text class="t" x="770.0" y="78.0" text-anchor="middle">Merge dev to main</text><text class="s" x="770.0" y="96.0" text-anchor="middle">next</text><line class="ar" x1="670" y1="82" x2="700" y2="82" marker-end="url(#ah)"/><rect class="bx warn" x="870" y="40" width="140" height="84" rx="8"/><text class="t" x="940.0" y="78.0" text-anchor="middle">Pull request</text><text class="s" x="940.0" y="96.0" text-anchor="middle">next</text><line class="ar" x1="840" y1="82" x2="870" y2="82" marker-end="url(#ah)"/><rect class="bx plan" x="20" y="160" width="990" height="52" rx="8"/><text class="t" x="515.0" y="191.0" text-anchor="middle">Later: merge conflicts · undo (restore, revert, reset, amend) · stash · rebase and cherry-pick · tags · .gitignore · history tools · branch protection</text></svg><figcaption>Fig. 1: what the history shows you have done, and what to practise next. A pull request cannot be seen from the local repository, so it is listed as next.</figcaption></figure></section><section><h2>Technical flow</h2><figure><svg viewBox="0 0 1010 250" role="img" aria-label="Files move from the working folder to staging to the local repository, then push to GitHub; fetch and pull bring changes back."><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="head" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bx ok" x="20" y="90" width="190" height="110" rx="8"/><text class="t" x="115.0" y="132.0" text-anchor="middle">Working folder</text><text class="s" x="115.0" y="150.0" text-anchor="middle">README.md</text><text class="s" x="115.0" y="168.0" text-anchor="middle">test_main.py</text><rect class="bx ok" x="280" y="90" width="190" height="110" rx="8"/><text class="t" x="375.0" y="141.0" text-anchor="middle">Staging area</text><text class="s" x="375.0" y="159.0" text-anchor="middle">git add</text><rect class="bx ok" x="540" y="90" width="190" height="110" rx="8"/><text class="t" x="635.0" y="132.0" text-anchor="middle">Local repository</text><text class="s" x="635.0" y="150.0" text-anchor="middle">main · dev</text><text class="s" x="635.0" y="168.0" text-anchor="middle">5 commits</text><rect class="bx ok" x="800" y="90" width="190" height="110" rx="8"/><text class="t" x="895.0" y="132.0" text-anchor="middle">GitHub (origin)</text><text class="s" x="895.0" y="150.0" text-anchor="middle">muzaffer01/learn-git</text><text class="s" x="895.0" y="168.0" text-anchor="middle">main · dev</text><line class="ar" x1="210" y1="130" x2="280" y2="130" marker-end="url(#ah)"/><text class="l" x="245" y="120" text-anchor="middle">add</text><line class="ar" x1="470" y1="130" x2="540" y2="130" marker-end="url(#ah)"/><text class="l" x="505" y="120" text-anchor="middle">commit</text><line class="ar" x1="730" y1="130" x2="800" y2="130" marker-end="url(#ah)"/><text class="l" x="765" y="120" text-anchor="middle">push</text><line class="ar" x1="800" y1="175" x2="730" y2="175" marker-end="url(#ah)"/><text class="l" x="765" y="195" text-anchor="middle">fetch, pull</text></svg><figcaption>Fig. 2: how a change travels. Nothing reaches GitHub until you push.</figcaption></figure></section><section><h2>Framework: stack</h2><figure><svg viewBox="0 0 900 290" role="img" aria-label="Stack: your files, git, the GitHub remote, and the editor."><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="head" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bx ok" x="20" y="16" width="860" height="54" rx="8"/><text class="t" x="40" y="40">YOUR FILES</text><text class="s" x="40" y="60">README.md with your git notes · test_main.py (a small calc class)</text><rect class="bx ok" x="20" y="82" width="860" height="54" rx="8"/><text class="t" x="40" y="106">GIT</text><text class="s" x="40" y="126">Local repository with branches main and dev</text><rect class="bx ok" x="20" y="148" width="860" height="54" rx="8"/><text class="t" x="40" y="172">REMOTE</text><text class="s" x="40" y="192">GitHub over SSH (git@github.com:muzaffer01/learn-git.git)</text><rect class="bx ok" x="20" y="214" width="860" height="54" rx="8"/><text class="t" x="40" y="238">EDITOR AND SHELL</text><text class="s" x="40" y="258">VS Code and a terminal</text></svg><figcaption>Fig. 3: there is no build system; the project is a place to practise.</figcaption></figure></section></main></body></html>
