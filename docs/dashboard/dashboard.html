<title>learn-git Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: practice log. Repo state and branch graph first, then skills practiced vs next, then the commit list. */
:root {
  --bg: #f3f5f2; --surface: #ffffff; --sunk: #e8ece7; --ink: #1b2320; --muted: #5d6a64; --line: #d3dad4;
  --accent: #1f4f8a; --done: #1e8756; --next: #3569c9; --pending: #c3cbc5; --warn: #b0701a; --alert: #c0412c;
  --display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121715; --surface: #1a211e; --sunk: #232c28; --ink: #e5ebe7; --muted: #9aa8a1; --line: #33403a;
    --accent: #8db4ec; --done: #4cc38a; --next: #6f9ef0; --pending: #3c4843; --warn: #e0a24a; --alert: #f07a64; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121715; --surface: #1a211e; --sunk: #232c28; --ink: #e5ebe7; --muted: #9aa8a1; --line: #33403a;
  --accent: #8db4ec; --done: #4cc38a; --next: #6f9ef0; --pending: #3c4843; --warn: #e0a24a; --alert: #f07a64; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--body); }
.wrap { max-width: 1100px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px; }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.head-row { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; padding-block: 14px; }
h1 { font: 700 26px/1.1 var(--display); margin: 0; text-wrap: balance; }
h1 span { color: var(--accent); }
.stamp { font: 500 12px/1.4 var(--mono); color: var(--muted); }
main { padding-top: 22px; display: grid; gap: 20px; }
h3 { font: 600 13px/1.2 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 18px; min-width: 0; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); }
.stats { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; display: grid; gap: 6px; align-content: start; }
.stat .label { font: 600 12px/1.2 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.stat .big { font: 700 34px/1 var(--display); font-variant-numeric: tabular-nums; }
.stat .big small { font-size: 17px; color: var(--muted); font-weight: 600; }
.stat .note { font-size: 13px; color: var(--muted); }
.meter { height: 8px; background: var(--sunk); border-radius: 4px; overflow: hidden; display: flex; }
.meter i { display: block; height: 100%; }
.alert { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 8%, var(--surface)); }
.alert h3 { color: var(--warn); }
.alert p { margin: 0 0 6px; max-width: 80ch; }
code { font: 500 13px var(--mono); }
.graph { width: 100%; height: auto; max-height: 230px; display: block; }
.graph text { font-family: var(--mono); font-size: 11px; fill: var(--ink); }
.graph .muted { fill: var(--muted); }
.skills { display: grid; gap: 6px; }
.skill { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-left-width: 4px; border-radius: 5px; }
.skill small { display: block; color: var(--muted); font-size: 13px; }
.skill code { color: var(--accent); }
.skill.done { border-left-color: var(--done); }
.skill.next { border-left-color: var(--next); }
.skill.pending { border-left-color: var(--pending); }
.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 1px 9px; font: 600 12px/1.6 var(--body); white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.p-done { color: var(--done); background: color-mix(in srgb, var(--done) 12%, transparent); }
.p-next { color: var(--next); background: color-mix(in srgb, var(--next) 12%, transparent); }
.p-pending { color: var(--muted); background: color-mix(in srgb, var(--muted) 10%, transparent); }
.table-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font: 600 12px/1.2 var(--display); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); padding: 8px 10px; border-bottom: 2px solid var(--line); white-space: nowrap; }
td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.mono { font: 500 12.5px/1.5 var(--mono); color: var(--accent); white-space: nowrap; }
.tag { font: 500 11px var(--mono); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; color: var(--muted); }
.foot { color: var(--muted); font-size: 13px; margin: 12px 0 0; }
@media (max-width: 560px) { h1 { font-size: 22px; } .stat .big { font-size: 28px; } }
</style>

<header class="top"><div class="wrap"><div class="head-row">
  <h1>learn-git <span>Dashboard</span></h1>
  <div class="stamp">Git practice repo · state read 2026-10-01</div>
</div></div></header>
<div class="wrap"><main id="view"></main></div>

<script>
const D = {
  commits: [
    ["3b3ab17", "2026-09-24", "dev", "read me updated with GIT commands info", "muzaffer01"],
    ["1a3b436", "2026-09-23", "main + dev", "add multiply", "muzaffer01"],
    ["3801cc1", "2026-09-23", "", "add function", "muzaffer01"],
    ["3d0629b", "2026-09-23", "", "i have added a comment'", "muzaffer01"],
    ["1f38353", "2026-09-23", "", "Add project description to README", "Muzaffer"]
  ],
  // status: done = shown in this repo's history, next = recommended next, pending = later
  skills: [
    ["done", "Initialize, stage and commit", "git init, git add, git commit: 5 commits in history"],
    ["done", "Rename the default branch", "git branch -M main (from your README notes)"],
    ["done", "Connect and push to GitHub", "git remote add origin, git push -u origin main; remote is muzaffer01/learn-git over SSH"],
    ["done", "Create and push a second branch", "dev exists locally and on origin, one commit ahead of main"],
    ["done", "Write a real change across commits", "test_main.py: add function, then multiply"],
    ["next", "Merge dev into main", "No merge commit exists yet. History is a straight line."],
    ["next", "Open a pull request on GitHub", "Not visible from the local repo. Do dev to main as a PR, then merge it."],
    ["next", "Create and resolve a merge conflict", "Edit the same line of README.md on main and dev, then merge"],
    ["next", "Undo things safely", "git restore, git revert, git reset (soft vs hard), git commit --amend"],
    ["pending", "Stash work in progress", "git stash, git stash pop"],
    ["pending", "Rebase and cherry-pick", "git rebase main on dev, git cherry-pick one commit"],
    ["pending", "Tags and a release", "git tag v0.1, push tags"],
    ["pending", ".gitignore and clean-up", "Ignore files, remove a tracked file, git clean"],
    ["pending", "Inspect history", "git log --graph, git diff, git blame, git bisect"],
    ["pending", "Branch protection and review", "Protect main, require a reviewer (matches your SeleniumAutomation plan)"]
  ]
};
const esc = s => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const LABEL = { done: "Practiced", next: "Do next", pending: "Later" };

function graph() {
  // Straight line of 5 commits, oldest left. main stops at the 4th, dev continues to the 5th.
  const xs = [60, 190, 320, 450, 580], y = 90;
  const line = `<line x1="${xs[0]}" y1="${y}" x2="${xs[4]}" y2="${y}" stroke="var(--line)" stroke-width="3"/>`;
  const dots = D.commits.slice().reverse().map((c, i) => `<circle cx="${xs[i]}" cy="${y}" r="9" fill="${i === 4 ? "var(--next)" : "var(--done)"}"/><text x="${xs[i]}" y="${y + 30}" text-anchor="middle">${c[0]}</text><text class="muted" x="${xs[i]}" y="${y + 45}" text-anchor="middle">${c[1].slice(5)}</text>`).join("");
  return `<svg class="graph" viewBox="0 0 680 190" role="img" aria-label="Commit history: main points at the fourth commit, dev at the fifth">
    ${line}${dots}
    <rect x="${xs[3] - 26}" y="22" width="52" height="22" rx="4" fill="var(--done)"/><text x="${xs[3]}" y="37" text-anchor="middle" style="fill:#fff;font-weight:600">main</text>
    <line x1="${xs[3]}" y1="44" x2="${xs[3]}" y2="${y - 10}" stroke="var(--done)" stroke-width="2"/>
    <rect x="${xs[4] - 22}" y="22" width="44" height="22" rx="4" fill="var(--next)"/><text x="${xs[4]}" y="37" text-anchor="middle" style="fill:#fff;font-weight:600">dev</text>
    <line x1="${xs[4]}" y1="44" x2="${xs[4]}" y2="${y - 10}" stroke="var(--next)" stroke-width="2"/>
    <text class="muted" x="12" y="${y + 4}">old</text><text class="muted" x="640" y="${y + 4}">new</text></svg>`;
}
function render() {
  const n = k => D.skills.filter(s => s[0] === k).length, total = D.skills.length;
  document.getElementById("view").innerHTML = `
  <div class="stats">
    <div class="stat"><div class="label">Commits</div><div class="big">${D.commits.length}</div><div class="note">4 on 2026-09-23, 1 on 09-24</div></div>
    <div class="stat"><div class="label">Branches</div><div class="big">2</div><div class="note">main and dev, both on GitHub</div></div>
    <div class="stat"><div class="label">dev vs main</div><div class="big">+1<small> ahead</small></div><div class="note">Not merged yet</div></div>
    <div class="stat"><div class="label">Skills practiced</div><div class="big">${n("done")}<small>/${total}</small></div>
      <div class="meter"><i style="width:${n("done") / total * 100}%;background:var(--done)"></i><i style="width:${n("next") / total * 100}%;background:var(--next)"></i><i style="width:${n("pending") / total * 100}%;background:var(--pending)"></i></div>
      <div class="note">${n("next")} next · ${n("pending")} later</div></div>
  </div>
  <section class="panel alert"><h3>Two things to fix in the notes and history</h3>
    <p>Your README says <code>git checkout -d dev</code>. <code>-d</code> means detach HEAD, not create a branch. To create one, use <code>git checkout -b dev</code> (or <code>git switch -c dev</code>).</p>
    <p>The commit author name differs: the first commit shows <code>Muzaffer</code> and the other 4 show <code>muzaffer01</code>. Same person, but GitHub and <code>git log</code> will treat them as two names. Setting <code>git config user.name</code> once keeps them the same.</p></section>
  <div class="grid">
    <section class="panel"><h3>Branch graph</h3>${graph()}<p class="foot">Green is on main. Blue is only on dev. Local and GitHub copies of both branches match.</p></section>
    <section class="panel"><h3>What is in the repo</h3><div class="table-scroll"><table><thead><tr><th>File</th><th>Holds</th></tr></thead><tbody>
      <tr><td class="mono" style="font:500 12.5px var(--mono)">README.md</td><td>Project note plus the git commands you ran (init, remote add, push, branch dev)</td></tr>
      <tr><td class="mono" style="font:500 12.5px var(--mono)">test_main.py</td><td>Class <code>calc</code> with <code>add</code> and <code>multiply</code>; it prints results and has no real tests yet</td></tr></tbody></table></div>
      <p class="foot">Remote: <code>git@github.com:muzaffer01/learn-git.git</code></p></section>
  </div>
  <section class="panel"><h3>Git skills: practiced and next</h3><div class="skills">${D.skills.map(s => `<div class="skill ${s[0]}"><div>${esc(s[1])}<small>${esc(s[2])}</small></div><span class="pill p-${s[0]}">${LABEL[s[0]]}</span></div>`).join("")}</div>
    <p class="foot">"Practiced" only counts what the local history shows. A pull request or conflict handled on GitHub would not appear here.</p></section>
  <section class="panel"><h3>Commit history</h3><div class="table-scroll"><table><thead><tr><th>Commit</th><th>Date</th><th>Branch</th><th>Message</th><th>Author</th></tr></thead><tbody>
    ${D.commits.map(c => `<tr><td class="mono">${c[0]}</td><td>${c[1]}</td><td>${c[2] ? `<span class="tag">${c[2]}</span>` : ""}</td><td>${esc(c[3])}</td><td>${esc(c[4])}</td></tr>`).join("")}</tbody></table></div></section>`;
}
render();
</script>
